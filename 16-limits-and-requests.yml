apiVersion: v1
kind: Pod
metadata:
  name: frontend
spec:
  containers:
  - name: app
    image: images.my-company.example/app:v4
    resources:
      requests:
        memory: "8Gi"
        cpu: "16"
      limits:
        memory: "16Gi"
        cpu: "32"
  - name: log-aggregator
    image: images.my-company.example/log-aggregator:v6
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"

# limits: the maximum amount of CPU and memory a container is allowed to use in the pod
# requests: the minimum amount of CPU and memory the scheduler should reserve for the container in the pod
