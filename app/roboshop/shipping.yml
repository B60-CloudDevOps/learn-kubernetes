# generate a deployment yaml for shipping component# create deployment with nginx as image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  labels:
    app: roboshop
    tier: shipping
spec:
  # modify replicas according to your case
  replicas: 5
  selector:
    matchLabels:
      tier: shipping
  template:
    metadata:
      labels:
        tier: shipping
    spec:
      containers:
      - name: shipping
        image: public.ecr.aws/w2x3d9u7/roboshop-60/shipping:v13
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: shipping-cm

---
# configMap for shipping component
apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping-cm
data:
  # property-like keys; each key maps to a simple value
  CART_ENDPOINT: "cart-svc:8080"
  DB_HOST: "mysql-test.robotshop.fun"

---

# create LoadBalancer service ; We can make the service accessible from outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: shipping-svc
spec:
  selector:
    tier: shipping
  ports:
    - protocol: TCP
      port: 8080                 # Service accepts the requests on this port
      targetPort: 8080           # Target port in the pods

---
# HPA for the deployment shipping 
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shipping-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shipping
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70